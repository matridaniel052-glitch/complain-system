<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — UTAS</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body class="auth-body">

<div class="auth-card" style="max-width:460px">

  <div class="auth-logo">
    <div class="logo-circle">
      <i class="bi bi-person-plus-fill"></i>
    </div>
    <h4>Student Registration</h4>
    <p>Create your UTAS account</p>
  </div>

  {% if error %}
  <div class="alert-error">
    <i class="bi bi-exclamation-triangle-fill"></i> {{ error }}
  </div>
  {% endif %}

  <!-- Figure 4.3 — Student Signup Form -->
  <form method="POST" action="{{ url_for('register') }}">

    <div class="form-group">
      <label class="form-label">Full Name</label>
      <input type="text" name="fullname" class="form-control"
             placeholder="e.g. Matri Daniel" required/>
    </div>

    <div class="form-group">
      <label class="form-label">Student ID</label>
      <input type="text" name="student_id" class="form-control"
             placeholder="e.g. 20220404014 (10-12 digits)" required/>
    </div>

    <div class="form-group">
      <label class="form-label">Level</label>
      <input type="text" name="level" class="form-control" placeholder="e.g. 200" />
    </div>

    <div class="form-group">
      <label class="form-label">Institutional Email</label>
      <input type="email" name="email" class="form-control"
             placeholder="yourID@utas.edu.gh" required/>
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control"
             placeholder="Minimum 8 characters" required/>
    </div>

    <div class="form-group">
      <label class="form-label">Confirm Password</label>
      <input type="password" name="confirm_password" class="form-control"
             placeholder="Re-enter your password" required/>
    </div>

    <button type="submit" class="btn-auth">
      <i class="bi bi-person-check-fill"></i> &nbsp;Create Account
    </button>
  </form>

  <div class="auth-footer">
    Already have an account? <a href="{{ url_for('login') }}">Login here</a>
    <br/>
    Department staff? <a href="{{ url_for('register_staff') }}">Request sub-admin access</a>
  </div>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
